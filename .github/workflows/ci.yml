# The build, test, format, lint, identity, smoke, coverage, and STE checks of every PR
# (D-2, D-117, D-481, D-504).
#
# The three legs use a label with a version, and a move to a newer image takes a PR (D-594).
# Each matrix job reports a name that holds its leg, and a skipped matrix job reports the
# literal name template. Thus a gate job of each family reports the stable name that
# branch protection requires (F-85, D-682, D-683).
# Each action pins a full commit SHA, and every other download checks its SHA-512 (D-511).
name: ci

on:
  pull_request:
  push:
    branches: [main]

# The jobs read the checkout alone (T-2).
permissions:
  contents: read

# A PR shares one group, and a new push cancels the run of the older head. Each push to `main`
# takes a group of its own commit. GitHub keeps one waiting run in a group and cancels an older
# waiting run, even with no cancel of the run in progress. One group for `main` thus dropped the
# middle run of three quick merges, and that merge lost the record of its checks (F-111).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  GODOT_VERSION: "4.7.2-stable"
  REPORT_GENERATOR_VERSION: "5.5.11"
  # The SHA-512 of the package file of that version. It matches the `packageHash` of the
  # NuGet catalog entry of the version (D-511, D-1116).
  REPORT_GENERATOR_SHA512: 5a971b175a894b20c276a7f892d4f24d0b2a5c7f16c29d1698fdc501d967e4e5ef5d60b9dc84a9ceda321994c7e288786352d1f91f5afc82ad97cf74db9edad5

jobs:
  changed-paths:
    name: changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The job reads the check runs of the previous head of the PR (D-858).
    permissions:
      contents: read
      checks: read
    outputs:
      documents-alone: ${{ steps.read.outputs.documents-alone }}
    steps:
      - name: Check out the branch and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # This step collects the facts alone, and the command of the next step decides (D-859).
      # Each value of the event goes through the environment, and never into the script text.
      - name: Write the facts of the change
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          BEFORE_REF: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          facts="$RUNNER_TEMP/changed-paths"
          rm -rf "$facts"
          mkdir -p "$facts"

          # A push to `main` runs every job, so it needs no fact (D-595).
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "The event '$EVENT_NAME' needs no path fact."
            exit 0
          fi

          # Three points give the paths that the PR changes from the merge base. Two points
          # would compare the two trees, and a branch behind `main` would then read every
          # path that `main` changed since the branch point as a path of the PR. Git finds
          # renames by default, and a rename then lists its new path alone. Each list of paths
          # thus takes `--no-renames`, so a move into `docs/` still lists the path that it left
          # (F-109).
          git diff --no-renames --name-only "$BASE_REF...$HEAD_REF" > "$facts/pr-paths.txt"
          echo "The PR changes these paths:"
          cat "$facts/pr-paths.txt"

          # The previous head is the `before` commit of a push to the PR (D-856). A new PR and
          # a reopen give none. After a force push, the commit is absent or is not an ancestor
          # of the head, and the command then reads the whole PR. Git writes the reason.
          if [ "$EVENT_ACTION" != "synchronize" ] || [ -z "$BEFORE_REF" ] ||
             [ "$BEFORE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "The event '$EVENT_ACTION' gives no previous head."
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_REF^{commit}" ||
             ! git merge-base --is-ancestor "$BEFORE_REF" "$HEAD_REF"; then
            echo "The previous head $BEFORE_REF is not an ancestor of $HEAD_REF."
            exit 0
          fi

          git diff --no-renames --name-only "$BEFORE_REF" "$HEAD_REF" > "$facts/push-paths.txt"
          echo "The push changes these paths from $BEFORE_REF:"
          cat "$facts/push-paths.txt"

          # The API gives the latest run of each name by default. One JSON object per line.
          gh api --paginate "repos/$REPOSITORY/commits/$BEFORE_REF/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, status, conclusion, app: .app.slug}' \
            > "$facts/previous-checks.jsonl"
          echo "The previous head has these check runs:"
          cat "$facts/previous-checks.jsonl"

      - name: Read the changed paths
        id: read
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          facts="$RUNNER_TEMP/changed-paths"
          arguments=(--event-name "$EVENT_NAME" --output "$GITHUB_OUTPUT")
          if [ -f "$facts/pr-paths.txt" ]; then
            arguments+=(--pr-paths "$facts/pr-paths.txt")
          fi

          if [ -f "$facts/push-paths.txt" ]; then
            arguments+=(--push-paths "$facts/push-paths.txt" --previous-checks "$facts/previous-checks.jsonl")
          fi

          # The command holds the docs-only set of D-600 and D-857, and the rule of the
          # previous head of D-856 and D-858. A skipped job reports `Success`, so a fault
          # here fails the job, and each gate job then fails too (T-2).
          dotnet run --project TheThingBelow.Tools/TheThingBelow.Tools.csproj -- changed-paths "${arguments[@]}"

  build-test-format:
    name: build, test, and format (${{ matrix.leg }})
    needs: changed-paths
    # The gate job of this job reports the required check (D-595, D-682, D-858).
    if: needs.changed-paths.outputs.documents-alone != 'true'
    runs-on: ${{ matrix.leg }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg: [ubuntu-24.04, windows-2025, macos-26]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the solution
        run: dotnet build TheThingBelow.slnx --configuration Release

      - name: Run every test outside the Smoke category
        run: |
          dotnet test --solution TheThingBelow.slnx --configuration Release --no-build \
            -- --filter-not-trait "Category=Smoke"

      - name: Check the format
        run: dotnet format TheThingBelow.slnx --verify-no-changes

  build-test-format-gate:
    # Branch protection matches a required check by its name. A matrix job that a condition
    # skips never expands its matrix, so it reports one check run with the literal name
    # template and not the three leg names (F-85). This job always runs, so its name is the
    # same on a code PR and on a docs-only PR. Branch protection requires this name, and the
    # job fails when any leg of the family fails (D-682, D-683).
    name: build, test, and format
    needs: [changed-paths, build-test-format]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the result of the three legs
        env:
          FAMILY: "build, test, and format"
          PATHS_RESULT: ${{ needs.changed-paths.result }}
          LEGS_RESULT: ${{ needs.build-test-format.result }}
          DOCUMENTS_ALONE: ${{ needs.changed-paths.outputs.documents-alone }}
        run: |
          set -euo pipefail

          # A fault in `changed-paths` skips the legs too. A skip that no condition asked
          # for never passes this gate (T-2).
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "The changed paths job ended with '$PATHS_RESULT' (T-2)." >&2
            exit 1
          fi

          # D-595 and D-856 skip the legs on a docs-only PR or a docs-only push.
          if [ "$LEGS_RESULT" = "success" ] ||
             { [ "$LEGS_RESULT" = "skipped" ] && [ "$DOCUMENTS_ALONE" = "true" ]; }; then
            echo "The $FAMILY legs ended with '$LEGS_RESULT', and this gate passes."
            exit 0
          fi

          echo "The $FAMILY legs ended with '$LEGS_RESULT' (T-2)." >&2
          echo "Read the check run of each leg for the failure." >&2
          exit 1

  coverage:
    name: coverage report (run)
    needs: changed-paths
    if: needs.changed-paths.outputs.documents-alone != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the solution
        run: dotnet build TheThingBelow.slnx --configuration Release

      - name: Measure the coverage with Coverlet
        run: |
          dotnet test --solution TheThingBelow.slnx --configuration Release --no-build \
            -- --filter-not-trait "Category=Smoke" --coverlet \
            --coverlet-output-format cobertura --results-directory artifacts/coverage

      # The step downloads the package file, checks its SHA-512, and installs from that folder
      # alone, as each other download checks its SHA-512 (D-511, D-1116).
      - name: Write the Markdown summary with ReportGenerator
        run: |
          set -euo pipefail
          package="dotnet-reportgenerator-globaltool.$REPORT_GENERATOR_VERSION.nupkg"
          mkdir -p report-generator-download
          curl --location --fail --silent --show-error \
            --output "report-generator-download/$package" \
            "https://api.nuget.org/v3-flatcontainer/dotnet-reportgenerator-globaltool/$REPORT_GENERATOR_VERSION/$package"
          actual=$(sha512sum "report-generator-download/$package" | cut -d ' ' -f 1)
          if [ "$actual" != "$REPORT_GENERATOR_SHA512" ]; then
            echo "The SHA-512 of $package does not match the value of this workflow (T-2)." >&2
            echo "  expected: $REPORT_GENERATOR_SHA512" >&2
            echo "  actual:   $actual" >&2
            exit 1
          fi
          echo "The SHA-512 of $package matches."
          dotnet tool install --global dotnet-reportgenerator-globaltool \
            --version "$REPORT_GENERATOR_VERSION" --source "$PWD/report-generator-download"
          reportgenerator \
            "-reports:artifacts/coverage/*.cobertura.*xml" \
            "-targetdir:artifacts/coverage-report" \
            "-reporttypes:MarkdownSummaryGithub;Cobertura"
          cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # No coverage number fails the build. The review reads the report (D-174, D-593).
      - name: Upload the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: artifacts/coverage-report
          retention-days: 14

  coverage-gate:
    # A plain job that a condition skips reports the conclusion `skipped`, and the rule of the
    # previous head reads that as no pass. This job always runs and reports `success` on a
    # docs-only head, so a second docs-only push can skip too. Branch protection requires this
    # name, and the job fails when the job it reads fails (D-682, D-858).
    name: coverage report
    needs: [changed-paths, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the result of the job
        env:
          FAMILY: "coverage report"
          PATHS_RESULT: ${{ needs.changed-paths.result }}
          JOB_RESULT: ${{ needs.coverage.result }}
          DOCUMENTS_ALONE: ${{ needs.changed-paths.outputs.documents-alone }}
        run: |
          set -euo pipefail

          # A fault in `changed-paths` skips the job too. A skip that no condition asked
          # for never passes this gate (T-2).
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "The changed paths job ended with '$PATHS_RESULT' (T-2)." >&2
            exit 1
          fi

          # D-595 and D-856 skip the job on a docs-only PR or a docs-only push.
          if [ "$JOB_RESULT" = "success" ] ||
             { [ "$JOB_RESULT" = "skipped" ] && [ "$DOCUMENTS_ALONE" = "true" ]; }; then
            echo "The $FAMILY job ended with '$JOB_RESULT', and this gate passes."
            exit 0
          fi

          echo "The $FAMILY job ended with '$JOB_RESULT' (T-2)." >&2
          echo "Read the check run of the job for the failure." >&2
          exit 1

  det-lint:
    name: det-lint (run)
    needs: changed-paths
    # The gate job of this job reports the required check (D-595, D-682, D-858).
    if: needs.changed-paths.outputs.documents-alone != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The lint reads the Godot assembly from the build output of the Game project, which
      # the NuGet restore of Godot.NET.Sdk writes. This leg needs no Godot editor (D-614, F-65).
      - name: Build the solution
        run: dotnet build TheThingBelow.slnx --configuration Release

      - name: Run the determinism and string lint
        run: |
          dotnet run --project TheThingBelow.Tools/TheThingBelow.Tools.csproj \
            --configuration Release --no-build -- det-lint --root . --configuration Release

  det-lint-gate:
    # A plain job that a condition skips reports the conclusion `skipped`, and the rule of the
    # previous head reads that as no pass. This job always runs and reports `success` on a
    # docs-only head, so a second docs-only push can skip too. Branch protection requires this
    # name, and the job fails when the job it reads fails (D-682, D-858).
    name: det-lint
    needs: [changed-paths, det-lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the result of the job
        env:
          FAMILY: "det-lint"
          PATHS_RESULT: ${{ needs.changed-paths.result }}
          JOB_RESULT: ${{ needs.det-lint.result }}
          DOCUMENTS_ALONE: ${{ needs.changed-paths.outputs.documents-alone }}
        run: |
          set -euo pipefail

          # A fault in `changed-paths` skips the job too. A skip that no condition asked
          # for never passes this gate (T-2).
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "The changed paths job ended with '$PATHS_RESULT' (T-2)." >&2
            exit 1
          fi

          # D-595 and D-856 skip the job on a docs-only PR or a docs-only push.
          if [ "$JOB_RESULT" = "success" ] ||
             { [ "$JOB_RESULT" = "skipped" ] && [ "$DOCUMENTS_ALONE" = "true" ]; }; then
            echo "The $FAMILY job ended with '$JOB_RESULT', and this gate passes."
            exit 0
          fi

          echo "The $FAMILY job ended with '$JOB_RESULT' (T-2)." >&2
          echo "Read the check run of the job for the failure." >&2
          exit 1

  replay-identity:
    name: replay-identity (${{ matrix.leg }})
    needs: changed-paths
    # The gate job of this job reports the required check (D-595, D-682, D-858).
    if: needs.changed-paths.outputs.documents-alone != 'true'
    runs-on: ${{ matrix.leg }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg: [ubuntu-24.04, windows-2025, macos-26]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the solution
        run: dotnet build TheThingBelow.slnx --configuration Release

      # Each leg computes the state hash of every run of the identity set and compares it
      # with the committed file. A mismatch names the leg, the run, and both hashes
      # (G-5, D-481, D-504).
      - name: Compare each state hash with the identity file
        run: |
          dotnet run --project TheThingBelow.Tools/TheThingBelow.Tools.csproj \
            --configuration Release --no-build -- replay-identity --root .

      # Each leg loads every content file and compares the content hash of the rule files
      # with the committed file. The `eol=lf` rule of `.gitattributes` keeps one set of
      # bytes on the Windows leg (G-5, D-495, D-648).
      - name: Compare the content hash with the committed file
        run: |
          dotnet run --project TheThingBelow.Tools/TheThingBelow.Tools.csproj \
            --configuration Release --no-build -- content-hash --root .

  replay-identity-gate:
    # This gate reports the stable name of the three legs of this family, as the
    # `build, test, and format` gate job above does (F-85, D-682, D-683).
    name: replay-identity
    needs: [changed-paths, replay-identity]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the result of the three legs
        env:
          FAMILY: "replay-identity"
          PATHS_RESULT: ${{ needs.changed-paths.result }}
          LEGS_RESULT: ${{ needs.replay-identity.result }}
          DOCUMENTS_ALONE: ${{ needs.changed-paths.outputs.documents-alone }}
        run: |
          set -euo pipefail

          # A fault in `changed-paths` skips the legs too. A skip that no condition asked
          # for never passes this gate (T-2).
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "The changed paths job ended with '$PATHS_RESULT' (T-2)." >&2
            exit 1
          fi

          # D-595 and D-856 skip the legs on a docs-only PR or a docs-only push.
          if [ "$LEGS_RESULT" = "success" ] ||
             { [ "$LEGS_RESULT" = "skipped" ] && [ "$DOCUMENTS_ALONE" = "true" ]; }; then
            echo "The $FAMILY legs ended with '$LEGS_RESULT', and this gate passes."
            exit 0
          fi

          echo "The $FAMILY legs ended with '$LEGS_RESULT' (T-2)." >&2
          echo "Read the check run of each leg for the failure." >&2
          exit 1

  smoke:
    name: smoke (${{ matrix.leg }})
    needs: changed-paths
    if: needs.changed-paths.outputs.documents-alone != 'true'
    runs-on: ${{ matrix.leg }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: ubuntu-24.04
            archive: Godot_v4.7.2-stable_mono_linux_x86_64.zip
            sha512: 1855960b27ee3ef5e66e5e228cced69d55637b24334a7411162687dcd077d8f9f645348cdb8eae984bec8135d49ed855a1e3a16476786b8bce60774fd8402d13
          - leg: windows-2025
            archive: Godot_v4.7.2-stable_mono_win64.zip
            sha512: 79229fd112b0c9cbeab82363a4ef7be18ea70f1caf86bf912789335b136fbe7e01db0053a33461438c5da1c680c17bbb10040bd09bedc51221cd4423d0367757
          - leg: macos-26
            archive: Godot_v4.7.2-stable_mono_macos.universal.zip
            sha512: 0862c53d7158c7a67f745e2e46f90b68cf5343cbe8b95d6d4333c469e42ca104af9c121d1746a50e5d221a99d09d82ef7016495f8e0d09255842884ed0502795
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The cache keeps the Godot editor between runs, and every run checks the SHA-512
      # of the file, a cache hit included (D-511, D-596).
      - name: Read the Godot editor from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: godot-download
          key: godot-${{ env.GODOT_VERSION }}-${{ matrix.archive }}

      - name: Get the Godot editor and check its SHA-512
        env:
          ARCHIVE: ${{ matrix.archive }}
          EXPECTED_SHA512: ${{ matrix.sha512 }}
        run: |
          set -euo pipefail
          mkdir -p godot-download

          if [ ! -f "godot-download/$ARCHIVE" ]; then
            echo "The cache holds no archive. The run downloads it."
            curl --location --fail --silent --show-error \
              --output "godot-download/$ARCHIVE" \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/$ARCHIVE"
          fi

          # The Linux and Windows images carry `sha512sum`, and the macOS image carries
          # `shasum`. The step reads the digest itself, so the error names both values (T-2).
          if command -v sha512sum > /dev/null 2>&1; then
            actual=$(sha512sum "godot-download/$ARCHIVE" | cut -d ' ' -f 1)
          elif command -v shasum > /dev/null 2>&1; then
            actual=$(shasum --algorithm 512 "godot-download/$ARCHIVE" | cut -d ' ' -f 1)
          else
            echo "This image carries no sha512sum and no shasum command (T-2)." >&2
            exit 1
          fi

          if [ "$actual" != "$EXPECTED_SHA512" ]; then
            echo "The SHA-512 of $ARCHIVE does not match the value of this workflow (T-2)." >&2
            echo "  expected: $EXPECTED_SHA512" >&2
            echo "  actual:   $actual" >&2
            exit 1
          fi
          echo "The SHA-512 of $ARCHIVE matches."

      - name: Unpack the Godot editor
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          rm -rf godot-editor
          mkdir -p godot-editor
          unzip -q "godot-download/$ARCHIVE" -d godot-editor

          # The archive of each leg holds one executable. The run fails when it holds none
          # or more than one, so no later step runs against the wrong file (T-2).
          matches=$(find godot-editor -type f \
            \( -name 'Godot_v*_mono_linux.x86_64' \
            -o -name 'Godot_v*_mono_win64.exe' \
            -o -path '*.app/Contents/MacOS/Godot' \))
          count=$(printf '%s\n' "$matches" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "The archive $ARCHIVE holds $count Godot executables, and not one (T-2)." >&2
            printf '%s\n' "$matches" >&2
            exit 1
          fi

          godot=$(printf '%s\n' "$matches")
          chmod +x "$godot"
          echo "GODOT=$PWD/$godot" >> "$GITHUB_ENV"

      - name: Build the Godot solution
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path TheThingBelow.Game \
            --build-solutions --quit 2>&1 | tee godot-build.log

          # The editor gives a nonzero exit code when the build callback fails, and
          # `pipefail` carries that code through `tee`. This grep is a second guard, and it
          # names the fault in the log (T-2, F-60).
          if grep -q "build callback failed" godot-build.log; then
            echo "The Godot build callback failed. Read godot-build.log (T-2)." >&2
            exit 1
          fi

      - name: Run the headless smoke session
        run: |
          set -euo pipefail
          # A session whose managed assembly does not load never reaches `Quit`, and it
          # runs without end. `--quit-after` ends it, so the job fails in seconds and not
          # at the time limit of the job (F-64).
          "$GODOT" --headless --path TheThingBelow.Game --quit-after 600 \
            -- --smoke 2>&1 | tee smoke.log

          # Such a session gives an exit code of 0 and writes no success line, so this step
          # reads the log too. `pipefail` above carries a nonzero code of the session through
          # `tee`, and that code fails the step before the log checks (T-2, D-117, F-64, D-694).
          if ! grep -q "smoke: the session ends with no error." smoke.log; then
            echo "The smoke session wrote no success line. Read smoke.log (T-2)." >&2
            exit 1
          fi
          if grep -E "^(ERROR|SCRIPT ERROR|USER ERROR)" smoke.log; then
            echo "The smoke session wrote an error line (T-2)." >&2
            exit 1
          fi

  smoke-gate:
    # This gate reports the stable name of the three legs of this family, as the
    # `build, test, and format` gate job above does (F-85, D-682, D-683).
    name: smoke
    needs: [changed-paths, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the result of the three legs
        env:
          FAMILY: "smoke"
          PATHS_RESULT: ${{ needs.changed-paths.result }}
          LEGS_RESULT: ${{ needs.smoke.result }}
          DOCUMENTS_ALONE: ${{ needs.changed-paths.outputs.documents-alone }}
        run: |
          set -euo pipefail

          # A fault in `changed-paths` skips the legs too. A skip that no condition asked
          # for never passes this gate (T-2).
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "The changed paths job ended with '$PATHS_RESULT' (T-2)." >&2
            exit 1
          fi

          # D-595 and D-856 skip the legs on a docs-only PR or a docs-only push.
          if [ "$LEGS_RESULT" = "success" ] ||
             { [ "$LEGS_RESULT" = "skipped" ] && [ "$DOCUMENTS_ALONE" = "true" ]; }; then
            echo "The $FAMILY legs ended with '$LEGS_RESULT', and this gate passes."
            exit 0
          fi

          echo "The $FAMILY legs ended with '$LEGS_RESULT' (T-2)." >&2
          echo "Read the check run of each leg for the failure." >&2
          exit 1

  # The screen-test job of D-172. A headless session draws nothing, so this job runs Godot
  # under Xvfb with the Mobile renderer on lavapipe, the software Vulkan driver of the pinned
  # Mesa (F-23, D-729, D-730, D-731). It runs on Linux alone, because one renderer and one
  # driver give one baseline (D-172).
  screen-test:
    name: screen-test (run)
    needs: changed-paths
    # The gate job of this job reports the required check (D-595, D-682, D-858).
    if: needs.changed-paths.outputs.documents-alone != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The snapshot timestamp and the Mesa version of D-730. A move of either one is a PR,
      # and that PR writes the new baseline too, because Mesa can change a pixel (D-172).
      MESA_SNAPSHOT: "20260901T000000Z"
      MESA_VERSION: "25.2.8-0ubuntu0.24.04.2"
      # The Vulkan loader and the software screen come from the same snapshot, with a pin of
      # their own, so no package of the picture moves between two jobs (OQ-246, D-1127).
      LIBVULKAN_VERSION: "1.3.275.0-1build1"
      XVFB_VERSION: "2:21.1.12-1ubuntu1.8"
      GODOT_ARCHIVE: Godot_v4.7.2-stable_mono_linux_x86_64.zip
      GODOT_SHA512: 1855960b27ee3ef5e66e5e228cced69d55637b24334a7411162687dcd077d8f9f645348cdb8eae984bec8135d49ed855a1e3a16476786b8bce60774fd8402d13
      # The screen of Xvfb holds the largest capture of the list, which is 2560 by 1440.
      XVFB_SCREEN: "2560x1440x24"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The snapshot service keeps every timestamp, so this version can never drop out of the
      # archive, and every run installs the same Mesa (D-729, D-730).
      - name: Install the pinned Mesa
        run: |
          set -euo pipefail
          sudo tee /etc/apt/sources.list.d/mesa-snapshot.sources > /dev/null <<SOURCES
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/$MESA_SNAPSHOT
          Suites: noble noble-updates
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "mesa-vulkan-drivers=$MESA_VERSION" \
            "libgl1-mesa-dri=$MESA_VERSION" \
            "libvulkan1=$LIBVULKAN_VERSION" \
            "xvfb=$XVFB_VERSION" "xserver-common=$XVFB_VERSION"

          # A dependency rule can pull another version, so the job reads back each one and
          # fails when it differs from the pin (D-729, T-2).
          for package in mesa-vulkan-drivers libgl1-mesa-dri; do
            actual=$(dpkg-query --show --showformat='${Version}' "$package")
            if [ "$actual" != "$MESA_VERSION" ]; then
              echo "The package $package is $actual, and the pin of D-730 is $MESA_VERSION (T-2)." >&2
              exit 1
            fi
            echo "The package $package is $actual, which matches the pin of D-730."
          done
          for pin in "libvulkan1=$LIBVULKAN_VERSION" "xvfb=$XVFB_VERSION" "xserver-common=$XVFB_VERSION"; do
            package="${pin%%=*}"
            expected="${pin#*=}"
            actual=$(dpkg-query --show --showformat='${Version}' "$package")
            if [ "$actual" != "$expected" ]; then
              echo "The package $package is $actual, and the pin of D-1127 is $expected (T-2)." >&2
              exit 1
            fi
            echo "The package $package is $actual, which matches the pin of D-1127."
          done

          # The Vulkan loader reads its drivers from this file. A path that no file holds
          # gives a loader with no driver, and Godot then falls back to OpenGL (D-731, T-2).
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -1)
          if [ -z "$icd" ]; then
            echo "The pinned Mesa installed no lavapipe driver file (D-730, D-731, T-2)." >&2
            ls -la /usr/share/vulkan/icd.d >&2 || true
            exit 1
          fi

          echo "The lavapipe driver file is $icd."
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      # The cache keeps the Godot editor between runs, and every run checks the SHA-512
      # of the file, a cache hit included (D-511, D-596).
      - name: Read the Godot editor from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: godot-download
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE }}

      # Lavapipe compiles its shaders for the CPU of the runner, so the job logs the CPU and
      # the vector flags that the compiler reads. A frame that moves by one level can then be
      # set against the CPU of its job (OQ-246, D-1127).
      - name: Log the CPU of the runner
        run: |
          set -euo pipefail
          model=$(lscpu | sed -n 's/^Model name: *//p')
          flags=$(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -xE 'sse4_2|avx|avx2|fma|f16c|avx512f|avx512vl' | sort | tr '\n' ' ')
          echo "The CPU of this runner is '$model', with $(nproc) cores and the vector flags: $flags"
          echo "screen-test CPU: '$model', $(nproc) cores, flags: $flags" >> "$GITHUB_STEP_SUMMARY"

      - name: Get the Godot editor and check its SHA-512
        run: |
          set -euo pipefail
          mkdir -p godot-download

          if [ ! -f "godot-download/$GODOT_ARCHIVE" ]; then
            echo "The cache holds no archive. The run downloads it."
            curl --location --fail --silent --show-error \
              --output "godot-download/$GODOT_ARCHIVE" \
              "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/$GODOT_ARCHIVE"
          fi

          actual=$(sha512sum "godot-download/$GODOT_ARCHIVE" | cut -d ' ' -f 1)
          if [ "$actual" != "$GODOT_SHA512" ]; then
            echo "The SHA-512 of $GODOT_ARCHIVE does not match the value of this workflow (T-2)." >&2
            echo "  expected: $GODOT_SHA512" >&2
            echo "  actual:   $actual" >&2
            exit 1
          fi
          echo "The SHA-512 of $GODOT_ARCHIVE matches."

      - name: Unpack the Godot editor
        run: |
          set -euo pipefail
          rm -rf godot-editor
          mkdir -p godot-editor
          unzip -q "godot-download/$GODOT_ARCHIVE" -d godot-editor

          matches=$(find godot-editor -type f -name 'Godot_v*_mono_linux.x86_64')
          count=$(printf '%s\n' "$matches" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "The archive $GODOT_ARCHIVE holds $count Godot executables, and not one (T-2)." >&2
            printf '%s\n' "$matches" >&2
            exit 1
          fi

          godot=$(printf '%s\n' "$matches")
          chmod +x "$godot"
          echo "GODOT=$PWD/$godot" >> "$GITHUB_ENV"

      - name: Build the Godot solution
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path TheThingBelow.Game \
            --build-solutions --quit 2>&1 | tee godot-build.log

          # The editor gives a nonzero exit code when the build callback fails, and
          # `pipefail` carries that code through `tee`. This grep is a second guard, and it
          # names the fault in the log (T-2, F-60).
          if grep -q "build callback failed" godot-build.log; then
            echo "The Godot build callback failed. Read godot-build.log (T-2)." >&2
            exit 1
          fi

      # Two runs must give the same frames: the capture session runs a fixed count of ticks
      # from the fixed fixture seed (T-7). The second run checks it. OQ-246 holds a flake of one
      # level in a few frames with lights and particles.
      - name: Take the captures two times
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          for run in 1 2; do
            rm -rf "captures-$run"
            # `xvfb-run` starts the software screen, waits for it, and stops it when the
            # session ends. It picks a free display itself, so no step of this job holds a
            # background process of another step (T-2).
            #
            # The runner has no sound card, and a session with a window opens the audio
            # driver of the system. The dummy driver keeps the job on the picture (D-172).
            xvfb-run --auto-servernum --server-args="-screen 0 $XVFB_SCREEN" \
              "$GODOT" --path TheThingBelow.Game --audio-driver Dummy --quit-after 1200 \
              -- --capture "$PWD/captures-$run" 2>&1 | tee "capture-$run.log"

            # The renderer check comes first, because a fallback explains every later fault.
            # Godot falls back to another driver when it cannot start the one of the project,
            # and another renderer draws another picture (D-616, D-731, T-2).
            for line in "capture: the rendering method is mobile." "capture: the rendering driver is vulkan."; do
              if ! grep -qF "$line" "capture-$run.log"; then
                echo "The capture session did not write '$line'. Read capture-$run.log (D-731, T-2)." >&2
                grep "^capture: the rendering" "capture-$run.log" >&2 || true
                exit 1
              fi
            done

            if ! grep -q "capture: the session wrote every frame." "capture-$run.log"; then
              echo "The capture session $run wrote no success line. Read capture-$run.log (T-2)." >&2
              exit 1
            fi

            # A shader that fails to compile writes its failure to the log alone, so an error
            # line fails this job (T-2, `docs/roadmaps/area-effects.md` section 7.13).
            if grep -E "^(ERROR|SCRIPT ERROR|USER ERROR)" "capture-$run.log"; then
              echo "The capture session $run wrote an error line (T-2)." >&2
              exit 1
            fi
          done

      - name: Compare the two runs
        run: |
          set -euo pipefail
          dotnet run --project TheThingBelow.Tools/TheThingBelow.Tools.csproj \
            -- screens --captures captures-2 --baseline captures-1

      - name: Compare the captures with the committed baseline
        run: |
          set -euo pipefail
          dotnet run --project TheThingBelow.Tools/TheThingBelow.Tools.csproj \
            -- screens --captures captures-1 --baseline screens/baseline

      # Every run keeps the captures, so an intended change of a screen gives the author the
      # new baseline to read and to commit (D-733).
      - name: Keep the captures of this run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen-captures
          path: captures-1
          if-no-files-found: warn

  screen-test-gate:
    # A plain job that a condition skips reports the conclusion `skipped`, and the rule of the
    # previous head reads that as no pass. This job always runs and reports `success` on a
    # docs-only head, so a second docs-only push can skip too. Branch protection requires this
    # name, and the job fails when the job it reads fails (D-682, D-858).
    name: screen-test
    needs: [changed-paths, screen-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the result of the job
        env:
          FAMILY: "screen-test"
          PATHS_RESULT: ${{ needs.changed-paths.result }}
          JOB_RESULT: ${{ needs.screen-test.result }}
          DOCUMENTS_ALONE: ${{ needs.changed-paths.outputs.documents-alone }}
        run: |
          set -euo pipefail

          # A fault in `changed-paths` skips the job too. A skip that no condition asked
          # for never passes this gate (T-2).
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "The changed paths job ended with '$PATHS_RESULT' (T-2)." >&2
            exit 1
          fi

          # D-595 and D-856 skip the job on a docs-only PR or a docs-only push.
          if [ "$JOB_RESULT" = "success" ] ||
             { [ "$JOB_RESULT" = "skipped" ] && [ "$DOCUMENTS_ALONE" = "true" ]; }; then
            echo "The $FAMILY job ended with '$JOB_RESULT', and this gate passes."
            exit 0
          fi

          echo "The $FAMILY job ended with '$JOB_RESULT' (T-2)." >&2
          echo "Read the check run of the job for the failure." >&2
          exit 1

  ste-check:
    name: ste-check
    # Every document PR takes this check, so it reads no path rule (D-10, G-12).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The command reads every live document that git tracks and holds the four dated record paths (D-10, D-608, D-702).
      - name: Run the STE checker
        run: dotnet run --project TheThingBelow.Tools/TheThingBelow.Tools.csproj -- ste-check --root .
