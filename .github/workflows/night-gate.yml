# The night gate of every pull request (G-22, D-509, D-510, D-513, D-1188). PR-49 creates it,
# and PR-108 adds the walk of D-1204 and the promotion of D-1202.
#
# The trigger is `pull_request_target`, so the workflow file and the command come from `main`.
# The job never checks out the head of the PR, and it reads no file of it. It reads the changed
# paths of the PR, its commits, the nights, and the promotion through the GitHub API, so a PR
# cannot carry its own night record (D-509, D-513). GitHub starts this trigger from the default
# branch alone, so the check first runs on the PR after PR-49 (F-37, D-500).
#
# The result of the last push stands until the merge (D-1188). After a night by hand on the head
# of a PR, or after a promotion, run this job again. `docs/runbooks/night.md` gives the commands.
#
# Each action pins a full commit SHA (D-511).
name: night-gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# The job reads the runs and the artifacts of the night, and the files of the PR. It writes
# nothing (D-509).
permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: night-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  night-gate:
    name: night-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # With `pull_request_target`, this action checks out the base branch, which is `main`.
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The facts action runs the `night-walk` command of Tools, so Tools builds first.
      - name: Build the tools
        run: dotnet build TheThingBelow.Tools/TheThingBelow.Tools.csproj --verbosity quiet

      # The action of the checkout of `main` reads the nights, the promotion, and the commits of
      # the PR through the GitHub API (D-1202, D-1204).
      - name: Read the nights, the promotion, and the commits
        uses: ./.github/actions/night-facts
        with:
          token: ${{ github.token }}
          pull-request: ${{ github.event.pull_request.number }}
          head: ${{ github.event.pull_request.head.sha }}
          folder: ${{ runner.temp }}/night-facts

      # Each value of the PR goes through the environment, and never into the text of the script.
      # The list of paths holds the old path of each rename, so a rename out of the code paths
      # still binds the PR (D-513, F-109).
      - name: Read the changed paths of the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          facts="$RUNNER_TEMP/night-facts"
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$facts/files.txt"
          jq -R -s -c --arg head "$HEAD_SHA" \
            '{head: $head, files: (split("\n") | map(select(length > 0)))}' \
            "$facts/files.txt" > "$facts/pull-request.json"

      # The command gives one line for each fact that it read, and the exit code of a fault (T-2).
      # The step holds the exit code until the report reaches the log and the summary.
      - name: Run the night gate
        run: |
          set -uo pipefail
          facts="$RUNNER_TEMP/night-facts"
          order=()
          if [ -f "$facts/promotion-order.txt" ]; then order=(--promotion-order "$(cat "$facts/promotion-order.txt")"); fi
          status=0
          dotnet run --project TheThingBelow.Tools/TheThingBelow.Tools.csproj --no-build --verbosity quiet \
            -- night-gate \
            --pull-request "$facts/pull-request.json" \
            --commits "$facts/commits.json" \
            --main-night "$facts/main-night" \
            --promotion "$facts/promotion" "${order[@]}" \
            --head-night "$facts/head-night" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/night-gate.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/night-gate.log"
          cat "$RUNNER_TEMP/night-gate.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
