; The export presets of the three targets of D-481: Windows and Linux on x86_64, and the
; universal macOS build (D-482). The export job of PR-54 runs one preset on each CI leg,
; and no other preset exists (D-449, D-503, D-512).
;
; No preset holds an include filter. The Game assembly carries every content file and each
; font as a resource, so the export needs no filter and no copy (D-508, F-42, F-73).
;
; An option that this file leaves out keeps the default of the export platform. Each option
; below is one that the export needs, and a review can read every one of them.
;
; The Godot editor rewrites this file when the owner saves the export dialog, and the rewrite
; drops these comments and writes every default option. A review of such a change reads the
; option list of the platform.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../artifacts/export/linux/the-thing-below.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../artifacts/export/windows/the-thing-below.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
ssh_remote_deploy/enabled=false

[preset.2]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../artifacts/export/macos/the-thing-below.app"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.2.options]

; The macOS export needs the universal binary format and the ETC2 ASTC texture format. An
; export with another pair of these two settings fails (F-74).
binary_format/architecture="universal"
texture_format/s3tc_bptc=false
texture_format/etc2_astc=true
application/bundle_identifier="com.thethingbelow.game"
; An arm64 binary needs a signature to start at all. The built-in signer of Godot writes an
; ad-hoc signature that the kernel refuses, and the process dies with signal 9 and no output
; (F-90). Value 3 calls the `codesign` command of the Xcode tools, which the macOS CI leg and
; the Mac of the owner both carry. PR-79 puts the real identity and the notarization on this
; leg (D-455, D-553).
codesign/codesign=3
codesign/identity="-"
notarization/notarization=0
ssh_remote_deploy/enabled=false
